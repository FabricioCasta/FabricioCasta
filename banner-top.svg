<svg width="860" height="230" viewBox="0 0 860 230" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @keyframes glowPulse {
        0%, 100% { filter: drop-shadow(0 0 6px #6B8E23) drop-shadow(0 0 18px #4a6320); }
        50%       { filter: drop-shadow(0 0 20px #8ec02e) drop-shadow(0 0 42px #6B8E23); }
      }
      @keyframes nameReveal {
        0%   { opacity: 0; letter-spacing: 20px; }
        65%  { opacity: 1; }
        100% { opacity: 1; letter-spacing: 4px; }
      }
      @keyframes bracketDraw {
        from { stroke-dashoffset: 120; opacity: 0; }
        to   { stroke-dashoffset: 0;   opacity: 0.65; }
      }
      @keyframes dotPulse {
        0%, 100% { opacity: 0.12; }
        50%      { opacity: 0.38; }
      }
      @keyframes labelFade {
        from { opacity: 0; }
        to   { opacity: 0.45; }
      }
      .name {
        font-family: 'Courier New', Courier, monospace;
        font-size: 52px;
        font-weight: 700;
        fill: #6B8E23;
        letter-spacing: 4px;
        animation: nameReveal 1.5s cubic-bezier(0.22,1,0.36,1) 0.3s both,
                   glowPulse 3.5s ease-in-out 2s infinite;
      }
      .bracket {
        fill: none;
        stroke: #6B8E23;
        stroke-width: 2.5;
        stroke-dasharray: 120;
        animation: bracketDraw 1s ease-out 0.1s both;
      }
      .accent-h {
        stroke: #6B8E23;
        stroke-width: 0.6;
        opacity: 0;
        animation: labelFade 1.2s ease-out 0.7s forwards;
      }
      .dot {
        fill: #6B8E23;
        animation: dotPulse 4s ease-in-out infinite;
      }
      .label {
        font-family: 'Courier New', Courier, monospace;
        font-size: 10px;
        fill: #6B8E23;
        letter-spacing: 2px;
        opacity: 0;
        animation: labelFade 1s ease-out 1.5s forwards;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="230" fill="#080808" rx="8"/>
  <rect x="1" y="1" width="858" height="228" fill="none" stroke="#6B8E23" stroke-width="0.4" rx="7" opacity="0.18"/>

  <!-- Grid dots — top-left -->
  <circle cx="55"  cy="30"  r="1.2" class="dot" style="animation-delay:0s"/>
  <circle cx="80"  cy="30"  r="1.2" class="dot" style="animation-delay:0.4s"/>
  <circle cx="105" cy="30"  r="1.2" class="dot" style="animation-delay:0.8s"/>
  <circle cx="55"  cy="55"  r="1.2" class="dot" style="animation-delay:0.2s"/>
  <circle cx="80"  cy="55"  r="1.2" class="dot" style="animation-delay:0.6s"/>
  <circle cx="105" cy="55"  r="1.2" class="dot" style="animation-delay:1.0s"/>
  <!-- Grid dots — top-right -->
  <circle cx="755" cy="30"  r="1.2" class="dot" style="animation-delay:0.3s"/>
  <circle cx="780" cy="30"  r="1.2" class="dot" style="animation-delay:0.7s"/>
  <circle cx="805" cy="30"  r="1.2" class="dot" style="animation-delay:1.1s"/>
  <circle cx="755" cy="55"  r="1.2" class="dot" style="animation-delay:0.1s"/>
  <circle cx="780" cy="55"  r="1.2" class="dot" style="animation-delay:0.5s"/>
  <circle cx="805" cy="55"  r="1.2" class="dot" style="animation-delay:0.9s"/>

  <!-- Corner brackets -->
  <path d="M22,22 L22,62 M22,22 L62,22" class="bracket"/>
  <path d="M838,22 L838,62 M838,22 L798,22" class="bracket"/>

  <!-- Horizontal accents -->
  <line x1="70" y1="48" x2="220" y2="48" class="accent-h"/>
  <line x1="640" y1="48" x2="790" y2="48" class="accent-h"/>

  <!-- Corner labels -->
  <text x="28" y="18" class="label">SYS.INIT</text>
  <text x="755" y="18" class="label">FC · v2026</text>

  <!-- Main name — no cursor -->
  <text x="430" y="112" text-anchor="middle" class="name">Fabricio Casta&#241;eda</text>

  <!-- ─── Wave section ──────────────────────────────────────── -->
  <!-- Nested SVG preserves the original wave coordinate system  -->
  <svg x="0" y="148" width="860" height="82" viewBox="0 24 150 28" preserveAspectRatio="none">
    <defs>
      <path id="wv" d="M-160 44c30 0 58-18 88-18s58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z"/>
    </defs>
    <!-- Layer 1 — olive green, fastest -->
    <use xlink:href="#wv" fill="rgba(107,142,35,0.60)">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="88,0" dur="7s" repeatCount="indefinite"/>
    </use>
    <!-- Layer 2 — olive green, medium, opposite direction -->
    <use xlink:href="#wv" y="3" fill="rgba(107,142,35,0.38)">
      <animateTransform attributeName="transform" type="translate" from="88,0" to="0,0" dur="10s" repeatCount="indefinite"/>
    </use>
    <!-- Layer 3 — blue, slow -->
    <use xlink:href="#wv" y="6" fill="rgba(74,144,217,0.30)">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="88,0" dur="13s" repeatCount="indefinite"/>
    </use>
    <!-- Layer 4 — blue, slowest, opposite -->
    <use xlink:href="#wv" y="9" fill="rgba(74,144,217,0.18)">
      <animateTransform attributeName="transform" type="translate" from="88,0" to="0,0" dur="16s" repeatCount="indefinite"/>
    </use>
  </svg>
  <!-- ─────────────────────────────────────────────────────── -->

</svg>
